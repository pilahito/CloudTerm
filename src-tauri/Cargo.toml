[package]
name = "cloudterm"
version = "1.0.0"
description = "CloudTerm — cliente de terminal SSH/SFTP con paneles de transferencia e IA"
authors = ["pilahito <57416155+pilahito@users.noreply.github.com>"]
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/pilahito/cloudterm"

[lib]
# The `_lib` suffix keeps the lib name unique and avoids conflicting with the
# bin name (only an issue on Windows, see rust-lang/cargo#8519).
name = "cloudterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-os = "2"

# --- async runtime (red TCP / timeouts / IO) ---
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "time",
  "io-util",
  "sync",
  "fs",
  "process",
] }

# --- serialización ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- inicio de sesión OAuth (PKCE, base64url, azar) ---
sha2 = "0.10"
base64 = "0.21"
rand = "0.8"
url = "2"

# --- segundo factor (TOTP) y contraseñas locales ---
hmac = "0.12"
sha1 = "0.10"
argon2 = "0.6"
qrcode = "0.14"

# --- hora local para el registro de conexiones ---
chrono = "0.4"

# --- SSH / SFTP / FTP ---
russh = "0.63.3"
russh-sftp = "3.0.0"
suppaftp = { version = "12.0.0", features = ["tokio-rustls-ring"] }

# --- credenciales en el llavero del sistema operativo ---
keyring = { version = "3", features = ["linux-native", "apple-native", "windows-native", "crypto-rust"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
futures-util = "0.3.34"
reqwest = { version = "0.13.5", features = ["json", "stream", "form", "query"] }

# Read the optimization guideline for more details:
# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
