name: Compilar APK de Android

# Android necesita el SDK y el NDK, que no vienen con la máquina: por eso se
# compila aquí y no en local.
#
# El APK resultante es **experimental**: CloudTerm usa PTY y SFTP, y en Android
# el backend todavía no tiene implementación de terminal. Sirve para ver la
# interfaz y para seguir trabajando en la adaptación táctil.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-22.04
    name: APK

    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK de Android
        uses: android-actions/setup-android@v4
        with:
          # El paquete legado `tools` ya no existe en el SDK y tumbaba v3.
          packages: platform-tools

      - name: NDK de Android
        run: |
          sdkmanager "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Rust con los destinos de Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Caché de Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Inicializar el proyecto Android
        run: npx tauri android init

      # Android NO instala un APK sin firmar: lo rechaza antes de abrirlo. Por
      # eso el que se publicaba («-unsigned») no arrancaba en el móvil.
      #
      # Se firma con un keystore propio si está en los secretos del repositorio
      # (ANDROID_KEYSTORE, en base64, más ANDROID_KEYSTORE_PASSWORD y
      # ANDROID_KEY_ALIAS). Si no lo hay, se genera uno desechable para que el
      # APK se pueda instalar y probar igualmente.
      #
      # Diferencia importante: con un keystore desechable, cada compilación
      # firma distinto y Android no deja actualizar encima — hay que desinstalar
      # antes. Para publicar de verdad hace falta el keystore fijo en secretos.
      - name: Preparar la firma
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          DESTINO="src-tauri/gen/android/keystore.jks"

          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "  Firmando con el keystore del repositorio."
            echo "$KEYSTORE_B64" | base64 -d > "$DESTINO"
            PASS="${KEYSTORE_PASSWORD:?falta ANDROID_KEYSTORE_PASSWORD}"
            ALIAS="${KEY_ALIAS:?falta ANDROID_KEY_ALIAS}"
          else
            echo "  Sin keystore en secretos: se genera uno desechable."
            echo "  El APK instalará, pero no se podrá actualizar encima."
            PASS="cloudterm"
            ALIAS="cloudterm"
            keytool -genkeypair -v \
              -keystore "$DESTINO" \
              -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=CloudTerm, OU=CloudTerm, O=CloudTerm, L=., S=., C=ES" >/dev/null 2>&1
          fi

          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=keystore.jks
          storePassword=$PASS
          keyAlias=$ALIAS
          keyPassword=$PASS
          EOF

      - name: Compilar el APK firmado
        run: npx tauri android build --apk

      # Se comprueba que de verdad quedó firmado: si no, el problema vuelve a
      # aparecer en el móvil sin que nadie se entere.
      - name: Comprobar que está firmado
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          test -n "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n 1)"
          if "$apksigner" verify --print-certs "$apk" >/dev/null 2>&1; then
            echo "  ✔ El APK está firmado"
          else
            echo "::error::El APK salió sin firmar. Android no lo instalará."
            exit 1
          fi

      - name: Nombrar el APK
        shell: bash
        run: |
          mkdir -p dist-apk
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          test -n "$apk"
          cp "$apk" dist-apk/CloudTerm-android.apk

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: cloudterm-apk
          path: dist-apk/*.apk
          if-no-files-found: error

      - name: Adjuntar a la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/*.apk
          draft: false
          fail_on_unmatched_files: true
