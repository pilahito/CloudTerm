name: Compilar APK de Android

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-22.04
    name: APK

    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK de Android
        uses: android-actions/setup-android@v3
        with:
          # La plantilla de Tauri 2.11.4 pide `compileSdk = 36` y `targetSdk = 36`.
          # Con la 34 el build fallaba con
          # "Failed to find target with hash string 'android-36'".
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: NDK de Android
        run: |
          sdkmanager "ndk;29.0.13846066"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.13846066" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.13846066" >> "$GITHUB_ENV"

      - name: Rust con los destinos de Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Caché de Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Inicializar el proyecto Android
        run: npx tauri android init

      - name: Parchear Gradle para firmar
        run: bash scripts/parchear-android-gradle.sh

      - name: Preparar la firma
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          DESTINO="$(pwd)/src-tauri/gen/android/keystore.jks"

          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "  Firmando con el keystore del repositorio."
            echo "$KEYSTORE_B64" | base64 -d > "$DESTINO"
            PASS="${KEYSTORE_PASSWORD:?falta ANDROID_KEYSTORE_PASSWORD}"
            ALIAS="${KEY_ALIAS:?falta ANDROID_KEY_ALIAS}"
          else
            echo "  Sin keystore en secretos: se genera uno desechable."
            PASS="cloudterm"
            ALIAS="cloudterm"
            keytool -genkeypair -v \
              -keystore "$DESTINO" \
              -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=CloudTerm, OU=CloudTerm, O=CloudTerm, L=., S=., C=ES" >/dev/null 2>&1
          fi

          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$DESTINO
          storePassword=$PASS
          keyAlias=$ALIAS
          keyPassword=$PASS
          EOF

      - name: Compilar el APK firmado
        run: npx tauri android build --apk
        env:
          # Identificadores integrados de fábrica: viajan dentro del APK, así
          # que quien lo instala solo pulsa «Iniciar sesión» y no crea nada en
          # Google Cloud. Se configuran UNA vez en los secretos del repositorio.
          # La credencial de Android es distinta de la de escritorio.
          CLOUDTERM_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.CLOUDTERM_GOOGLE_ANDROID_CLIENT_ID }}
          CLOUDTERM_GITHUB_CLIENT_ID: ${{ secrets.CLOUDTERM_GITHUB_CLIENT_ID }}

      - name: Comprobar que está firmado
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          test -n "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n 1)"
          if "$apksigner" verify --print-certs "$apk" >/dev/null 2>&1; then
            echo "  APK firmado correctamente"
          else
            echo "::error::El APK salió sin firmar."
            exit 1
          fi

      - name: Nombrar el APK
        shell: bash
        run: |
          mkdir -p dist-apk
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          test -n "$apk"
          cp "$apk" dist-apk/CloudTerm-android.apk

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: cloudterm-apk
          path: dist-apk/*.apk
          if-no-files-found: error

      - name: Adjuntar a la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/*.apk
          draft: false
          fail_on_unmatched_files: true